<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="session-token" content="__SESSION_TOKEN__"><title>北四楼来信 · 本地进度管理</title><link rel="stylesheet" href="/manager/style.css"><script type="module" src="/manager/app.js"></script></head><body>
<header><div><strong>北四楼来信</strong><h1>本地进度管理</h1><p>编辑草稿 → 校验并预览 → 应用到本地网站</p></div><a href="/preview/" target="_blank" rel="noopener">查看本地网站 ↗</a></header>
<div class="toolbar"><span id="save-status" role="status">正在载入…</span><button id="export">导出草稿</button><button id="reload">重新载入</button><button id="discard">丢弃草稿</button><button id="validate">校验并预览</button><button id="apply" class="primary" disabled>应用到本地网站</button></div>
<p id="error" role="alert" hidden></p>
<div class="layout"><nav aria-label="管理区域"><button data-page="todos" aria-current="page">Todo 管理</button><button data-page="scores">评分与验收</button><button data-page="evaluation">评估内容</button><button data-page="content">网站文案</button><button data-page="rules">评分规则</button><button data-page="records">应用记录</button></nav><main>
<section class="change-panel"><h2>本次变更</h2><div class="form-grid"><label>变更类型<select id="change-type"><option value="status_update">任务状态／验收</option><option value="refinement">已有目标细化（保持预算）</option><option value="demo_expansion">Demo 范围／预算变化</option><option value="future">后续计划调整</option><option value="rule_change">评分规则调整</option><option value="manual_score_update">手动评分调整</option></select></label><label>变更原因<input id="change-reason" placeholder="结构、权重、范围和规则变化时必填"></label></div><p>涉及 Demo 目标范围调整时，请同步维护 Demo目标.md。本工具不编辑目标文档。</p></section>
<section id="workspace" aria-live="polite"></section><section id="validation" hidden><h2>校验与变更预览</h2><div id="validation-result"></div></section>
</main></div><dialog id="editor"><form id="editor-form"><div class="dialog-heading"><h2 id="editor-title"></h2><button type="button" id="close-editor">关闭</button></div><div id="editor-fields"></div><p id="editor-error" role="alert"></p><button type="submit" class="primary">保存到草稿</button></form></dialog>
<dialog id="confirm"><h2 id="confirm-title"></h2><p id="confirm-text"></p><div class="actions"><button id="confirm-no">取消</button><button id="confirm-yes" class="primary">确认</button></div></dialog>
</body></html>
