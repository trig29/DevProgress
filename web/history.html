<body data-page="history">

      <span>北四楼来信<small>开发进度</small></span>

    <nav aria-label="页面导航"><a href="./index.html">进度概览</a><a href="./dimensions.html">维度进度</a><a href="./updates.html">最近更新</a><a href="./todos.html">Todo 清单</a><a href="./history.html" aria-current="page">历史记录</a><a href="./method.html">计算说明</a></nav>

  <main id="main" class="wrap">
    <div id="loading" class="load-panel" role="status">正在读取进度数据…</div>
    <section id="error" class="load-panel error-panel" hidden aria-labelledby="error-title"><h1 id="error-title">进度数据加载失败</h1><p id="error-message"></p><button id="retry" type="button">重新读取数据</button></section>
    <div id="dashboard" hidden><header class="page-heading"><p class="eyebrow">开发进度 <span class="phase" id="phase"></span></p><h1>历史记录</h1><p class="intro">查看完成度趋势与各次评估的范围、规则和结果。</p><dl class="meta"><div><dt>最近评估</dt><dd id="evaluated"></dd></div><div><dt>网站发布</dt><dd id="published"></dd></div></dl></header>

        <div class="chart-paper">
          <fieldset id="series-controls"><legend>显示趋势</legend></fieldset>
          <div id="chart" class="chart"></div><p id="chart-note" class="small-note"></p>
        </div>
        <div id="history-log" class="history-log"></div>
      </section>
    </div>
    <noscript><p class="load-panel">请启用 JavaScript 以浏览进度。也可以<a href="./data/todo.json">读取完整 Todo JSON</a>。</p></noscript>
